<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Volume de chuva acumulada por ano (2016 a 2025) - Fazenda Carnaúba - Taperoá - PB</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #f4f8fb;
      color: #172033;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 1180px;
      margin: 0 auto;
      padding: 28px 0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 36px;
      line-height: 1.15;
    }

    p {
      margin: 0 0 16px;
      color: #526174;
      font-size: 16px;
      line-height: 1.45;
    }

    section {
      background: #ffffff;
      border: 1px solid #d7e1ec;
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 12px 34px rgba(23, 32, 51, 0.08);
    }

    #chart {
      width: 100%;
      height: 620px;
    }

    .note {
      margin-top: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Volume de chuva acumulada por ano (2016 a 2025) - Fazenda Carnaúba - Taperoá - PB</h1>
    <p>Total anual de chuva medido na Fazenda Carnaúba, em Taperoá - PB.</p>

    <section>
      <div id="chart"></div>
      <p class="note">Tipo escolhido: gráfico de barras básico, adequado para comparar totais anuais discretos em uma escala comum de milímetros.</p>
    </section>
  </main>

  <script>
    const dados = [
      { ano: 2016, total: 295.0 },
      { ano: 2017, total: 211.5 },
      { ano: 2018, total: 764.8 },
      { ano: 2019, total: 497.9 },
      { ano: 2020, total: 591.3 },
      { ano: 2021, total: 388.5 },
      { ano: 2022, total: 938.6 },
      { ano: 2023, total: 465.6 },
      { ano: 2024, total: 378.2 },
      { ano: 2025, total: 528.5 }
    ];

    const anos = dados.map((item) => String(item.ano));
    const totais = dados.map((item) => item.total);
    const chart = echarts.init(document.getElementById("chart"));

    const formatar = (valor) => Number(valor).toLocaleString("pt-BR", {
      minimumFractionDigits: 1,
      maximumFractionDigits: 1
    });

    chart.setOption({
      title: {
        text: "Chuva acumulada anual",
        subtext: "Total em milímetros (mm)",
        left: 10,
        top: 8
      },
      tooltip: {
        trigger: "axis",
        axisPointer: { type: "shadow" },
        formatter: (params) => {
          const ponto = params[0];
          return `<strong>${ponto.axisValue}</strong><br>Total: <strong>${formatar(ponto.value)} mm</strong>`;
        }
      },
      toolbox: {
        right: 14,
        top: 10,
        feature: {
          dataZoom: { yAxisIndex: "none" },
          restore: {},
          saveAsImage: { name: "Lab6-ViniciusNobrega-Projeto1" }
        }
      },
      grid: {
        left: 70,
        right: 40,
        top: 95,
        bottom: 95,
        containLabel: true
      },
      xAxis: {
        type: "category",
        data: anos,
        axisTick: { alignWithLabel: true }
      },
      yAxis: {
        type: "value",
        name: "Chuva (mm)",
        min: 0
      },
      dataZoom: [
        { type: "inside", xAxisIndex: 0 },
        { type: "slider", xAxisIndex: 0, bottom: 35 }
      ],
      series: [
        {
          name: "Total anual",
          type: "bar",
          data: totais,
          barMaxWidth: 58,
          itemStyle: {
            color: "#2f80ed"
          },
          label: {
            show: true,
            position: "top",
            formatter: ({ value }) => formatar(value)
          }
        }
      ]
    });
  </script>
</body>
</html>
